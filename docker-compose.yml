name: taxi-pipeline

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  seaweedfs:
    build:
      context: ./seaweedfs
    image: localhost/taxi-pipeline/seaweedfs:0.1.0
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_SIGNING_KEY:?siehe .env.example}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?siehe .env.example}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?siehe .env.example}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY:?siehe .env.example}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY:?siehe .env.example}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    networks: [lakenet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

  lake-init:
    image: localhost/taxi-pipeline/seaweedfs:0.1.0
    entrypoint: ["/usr/local/bin/init-buckets.sh"]
    environment:
      SEAWEEDFS_MASTER: seaweedfs:9333
      LAKE_BUCKETS: bronze silver gold
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [lakenet]
    restart: on-failure:3
    logging: *default-logging

  ingestion:
    build:
      context: ./services/ingestion
    image: localhost/taxi-pipeline/ingestion:0.1.0
    # Nur die eigene Identität: Least Privilege, kein Zugriff auf silver/gold.
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
      BRONZE_BUCKET: bronze
      TLC_BASE_URL: https://d37ci6vzurychx.cloudfront.net/trip-data
      TLC_DATASET: yellow_tripdata
      INGEST_PERIOD: ${INGEST_PERIOD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      lake-init:
        condition: service_completed_successfully
    networks: [lakenet]
    restart: on-failure:2
    logging: *default-logging

  spark-master:
    build:
      context: ./services/spark
    image: localhost/taxi-pipeline/spark:0.1.0
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    # Nur im Rechennetz: der Master braucht keinen Zugriff auf den Data Lake.
    networks: [sparknet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

  spark-worker:
    image: localhost/taxi-pipeline/spark:0.1.0
    command: ["/usr/local/bin/start-worker.sh"]
    # Keine S3-Zugangsdaten: die Executors erhalten sie über die Konfiguration des Jobs.
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    # Horizontal skalierbar: docker compose up --scale spark-worker=N
    deploy:
      replicas: 2
    depends_on:
      spark-master:
        condition: service_healthy
    networks: [sparknet, lakenet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

  # Spark-Job 1 als One-Shot-Container (Driver im Client-Modus). Für einen anderen Zeitraum
  # docker compose run --rm --no-deps silver-job --month 2024-01, sonst lädt die Abhängigkeit
  # ingestion zuerst den Zeitraum aus .env.
  silver-job:
    image: localhost/taxi-pipeline/spark:0.1.0
    entrypoint:
      - /usr/local/bin/submit-job.sh
      - /opt/spark-jobs/spark_jobs/bronze_to_silver.py
    command: []
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      BRONZE_BUCKET: bronze
      SILVER_BUCKET: silver
      # submit-job.sh prüft, dass der Executor in einen Worker passt.
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      TLC_DATASET: yellow_tripdata
      INGEST_PERIOD: ${INGEST_PERIOD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      ingestion:
        condition: service_completed_successfully
      spark-worker:
        condition: service_healthy
    networks: [sparknet, lakenet]
    # Kein on-failure: Compose würde auch Exit 2 (Konfiguration) und 3 (Bronze-Monat fehlt) wiederholen.
    restart: "no"
    logging: *default-logging

  # Spark-Job 2: stündliche Nachfrage je Zone aus Silver nach Gold. Einzelläufe wie beim
  # silver-job mit docker compose run --rm --no-deps gold-job --month 2024-01.
  gold-job:
    image: localhost/taxi-pipeline/spark:0.1.0
    entrypoint:
      - /usr/local/bin/submit-job.sh
      - /opt/spark-jobs/spark_jobs/silver_to_gold.py
    command: []
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      SILVER_BUCKET: silver
      GOLD_BUCKET: gold
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      TLC_DATASET: yellow_tripdata
      INGEST_PERIOD: ${INGEST_PERIOD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      silver-job:
        condition: service_completed_successfully
      spark-worker:
        condition: service_healthy
    networks: [sparknet, lakenet]
    restart: "no"
    logging: *default-logging

networks:
  lakenet:
    name: taxi-pipeline-lakenet
  sparknet:
    name: taxi-pipeline-sparknet

volumes:
  seaweedfs-data:
    name: taxi-pipeline-seaweedfs-data
