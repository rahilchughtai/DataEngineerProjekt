# docker compose up führt einen vollständigen Lauf für INGEST_PERIOD (.env) aus:
#
#   seaweedfs → lake-init → ingestion → silver-job → gold-job → report
#
# Jeder Schritt startet erst, wenn der vorige erfolgreich beendet ist; ein Fehler hält die Kette
# an. SeaweedFS (Data Lake) und der Spark-Cluster laufen danach weiter.
name: taxi-pipeline

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

# Die Spark-Jobs: ein Container je Schritt, der den Job beim Cluster einreicht und sich danach beendet.
# Nur die Spark-Identität: liest bronze, schreibt silver und gold.
x-spark-job: &spark-job
  image: localhost/taxi-pipeline/spark:0.1.0
  pull_policy: never
  environment:
    INGEST_PERIOD: ${INGEST_PERIOD:?siehe .env.example}
    S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
    S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
    # Speicher je Executor; muss unter SPARK_WORKER_MEMORY liegen, sonst wartet der Job endlos.
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
  restart: "no"

services:
  # Data Lake: S3-kompatibler Objektspeicher mit den Buckets bronze, silver und gold.
  seaweedfs:
    build: ./seaweedfs
    image: localhost/taxi-pipeline/seaweedfs:0.1.0
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_SIGNING_KEY:?siehe .env.example}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?siehe .env.example}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?siehe .env.example}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY:?siehe .env.example}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY:?siehe .env.example}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]

  # Legt die Buckets an, falls sie fehlen.
  lake-init:
    image: localhost/taxi-pipeline/seaweedfs:0.1.0
    pull_policy: never
    entrypoint: ["/usr/local/bin/init-buckets.sh"]
    environment:
      SEAWEEDFS_MASTER: seaweedfs:9333
      LAKE_BUCKETS: bronze silver gold
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # Schritt 1: TLC-Monatsdateien → bronze. Nur die Ingestion-Identität (schreibt nur bronze).
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    image: localhost/taxi-pipeline/ingestion:0.1.0
    environment:
      INGEST_PERIOD: ${INGEST_PERIOD:?siehe .env.example}
      TLC_BASE_URL: ${TLC_BASE_URL:?siehe .env.example}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
    depends_on:
      lake-init:
        condition: service_completed_successfully
    restart: "no"

  spark-master:
    build:
      context: .
      dockerfile: services/spark/Dockerfile
    image: localhost/taxi-pipeline/spark:0.1.0
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080"]

  # Rechenknoten ohne S3-Zugangsdaten: die Executors erhalten sie über den Job.
  # Horizontal skalierbar: docker compose up --scale spark-worker=N
  spark-worker:
    image: localhost/taxi-pipeline/spark:0.1.0
    pull_policy: never
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    deploy:
      replicas: 2
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081"]

  # Schritt 2: bronze → silver (Qualitätsregeln, Quarantäne).
  silver-job:
    <<: *spark-job
    command: [spark-submit, --master=spark://spark-master:7077, --conf=spark.driver.host=silver-job, /opt/jobs/bronze_to_silver.py]
    depends_on:
      ingestion:
        condition: service_completed_successfully
      spark-worker:
        condition: service_healthy

  # Schritt 3: silver → gold (stündliche Nachfrage je Zone).
  gold-job:
    <<: *spark-job
    command: [spark-submit, --master=spark://spark-master:7077, --conf=spark.driver.host=gold-job, /opt/jobs/silver_to_gold.py]
    depends_on:
      silver-job:
        condition: service_completed_successfully

  # Schritt 4: Laufbericht nach gold/_reports/<INGEST_PERIOD>/.
  report:
    <<: *spark-job
    command: [spark-submit, --master=spark://spark-master:7077, --conf=spark.driver.host=report, /opt/jobs/report.py]
    depends_on:
      gold-job:
        condition: service_completed_successfully

volumes:
  seaweedfs-data:
