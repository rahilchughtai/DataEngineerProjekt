name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_CMD: docker compose
  UV_VERSION: "0.12.10" # wie in services/ingestion/Dockerfile

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Jeder Service ist ein eigenes uv-Projekt mit eigenem tests/-Verzeichnis.
        service: [ingestion, spark, orchestrator]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      # PySpark braucht eine JVM; Spark 4 setzt Java 17 voraus (wie im Spark-Image).
      - if: matrix.service == 'spark'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      # --frozen bricht ab, wenn uv.lock nicht zu pyproject.toml passt.
      - run: uv sync --frozen
      - run: uv run pytest

  # Alle pre-commit-Hooks (inkl. Ruff mit der zentralen Konfiguration aus pyproject.toml), weil
  # sie sich lokal umgehen lassen. Ändert ein Hook eine Datei (z. B. ruff --fix), scheitert der
  # Lauf; --show-diff-on-failure zeigt die nötige Änderung im Log.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Hook-Umgebungen, damit pre-commit sie nicht bei jedem Lauf neu installiert.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: uv sync --frozen
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # End-to-End-Lauf über den echten Orchestrator mit den echten Images, SeaweedFS und dem
  # Spark-Cluster. Ingestion lädt gekürzte echte TLC-Dateien (tests/e2e/fixtures) von einem
  # Mock-Server statt von CloudFront. Prüft Ingestion, Job 1 und Job 2 über ein Quartal, die
  # Wiederholung (idempotent), ein nicht veröffentlichtes Quartal (403 → Exit-Code 3),
  # Zugriffsrechte und die Run-ID über alle Schichten. Podman deckt er nicht ab.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e
    env:
      # Stack nach pytest stehen lassen, damit die Logs bei einem Fehler noch abrufbar sind.
      E2E_KEEP: "1"
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/tests/e2e/compose.e2e.yml
      COMPOSE_ENV_FILES: ${{ github.workspace }}/.env,${{ github.workspace }}/tests/e2e/e2e.env
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            tests/e2e/uv.lock
            services/orchestrator/uv.lock

      - name: .env aus dem Beispiel
        run: cp ../../.env.example ../../.env

      - run: uv sync --frozen
      # -s zeigt Build- und Job-Ausgaben sofort; bei einem Abbruch durch timeout-minutes gingen
      # von pytest gepufferte Ausgaben sonst verloren.
      - run: uv run pytest -v -s --durations=5

      - name: Logs
        if: failure() || cancelled()
        run: $COMPOSE_CMD --profile jobs logs --no-color

      - name: Aufräumen
        if: always()
        run: $COMPOSE_CMD --profile jobs down --volumes --remove-orphans

  # Einziger Pflicht-Check im Branch-Schutz: neue Services in der Matrix zählen automatisch mit,
  # neue Jobs genügt es in needs einzutragen.
  # always(), weil GitHub einen übersprungenen Pflicht-Check als bestanden wertet.
  tests-passed:
    needs: [unit-tests, lint, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle Jobs aus needs erfolgreich
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
