name: Tests

# Pull Request: Unit-Tests und Lint, beim Release-PR nach main auch E2E. Merge nach develop: E2E.
# Merge nach main: alles.
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.10" # wie in services/ingestion/Dockerfile

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.project }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Jedes Projekt (Service oder Bibliothek) ist ein eigenes uv-Projekt mit eigenem tests/.
        project: [services/ingestion, services/spark, libs/pipeline_common]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5

      # PySpark braucht eine JVM; Spark 4 setzt Java 17 voraus (wie im Spark-Image).
      - if: matrix.project == 'services/spark'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      # --frozen bricht ab, wenn uv.lock nicht zu pyproject.toml passt.
      - run: uv sync --frozen
      - run: uv run pytest

  # Alle pre-commit-Hooks (inkl. Ruff mit der zentralen Konfiguration aus pyproject.toml), weil
  # sie sich lokal umgehen lassen. Ändert ein Hook eine Datei (z. B. ruff --fix), scheitert der
  # Lauf; --show-diff-on-failure zeigt die nötige Änderung im Log.
  lint:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Hook-Umgebungen, damit pre-commit sie nicht bei jedem Lauf neu installiert.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: uv sync --frozen
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # End-to-End-Lauf über docker-compose.test.yml: dieselbe Pipeline mit den echten Images,
  # SeaweedFS und dem Spark-Cluster, nur lädt die Ingestion gekürzte echte TLC-Dateien
  # (tests/e2e/fixtures) von einem Mock-Server. Am Ende der Kette prüft der Container e2e-tests den
  # Lake für 2024Q1; sein Exit-Code ist das Ergebnis. Danach läuft alles ein zweites Mal auf dem
  # befüllten Lake (Idempotenz). Lokal läuft derselbe Befehl, Podman deckt CI nicht ab.
  # Bei Pull Requests nur vor dem Release nach main: zwei Läufe mit Image-Builds dauern rund zehn
  # Minuten.
  e2e:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example
    steps:
      - uses: actions/checkout@v5

      - run: $COMPOSE run --build --rm e2e-tests

      # Zweiter Lauf auf dem befüllten Lake (down ohne --volumes behält ihn): Die Ingestion
      # überspringt unveränderte Dateien, Silver und Gold ersetzen ihre Partitionen. Dieselben
      # Prüfungen scheitern, wenn die Wiederholung Zeilen verdoppelt oder Dateien liegen lässt.
      - name: Wiederholung
        run: |
          $COMPOSE down
          $COMPOSE run --rm e2e-tests

      # run zeigt nur die Ausgabe von e2e-tests, nicht die der Pipeline-Schritte.
      - name: Logs
        if: failure() || cancelled()
        run: $COMPOSE logs --no-color

      - name: Aufräumen
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  # Einziger Pflicht-Check im Branch-Schutz: neue Services in der Matrix zählen automatisch mit,
  # neue Jobs genügt es in needs einzutragen. Je nach Ereignis übersprungene Jobs zählen als
  # bestanden. always(), weil GitHub einen übersprungenen Pflicht-Check als bestanden wertet.
  tests-passed:
    needs: [unit-tests, lint, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle Jobs aus needs erfolgreich
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
