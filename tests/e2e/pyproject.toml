[project]
name = "e2e"
version = "0.1.0"
description = "End-to-End-Test der Pipeline mit Mock-TLC-Quelle und gekürzten echten Daten."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "orchestrator",
    "pyarrow>=21",
    "pytest>=8.4",
]

[tool.uv]
package = false

# Getestet wird der echte Orchestrator, nicht eine Nachbildung seiner Aufrufe.
[tool.uv.sources]
orchestrator = { path = "../../services/orchestrator", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
# Fortschritt des Orchestrators live statt erst am Ende eines minutenlangen Fixtures.
log_cli = true
log_cli_level = "INFO"
