worker_processes  1;
pid               /tmp/nginx.pid;

events {
    worker_connections  64;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    server {
        listen  80;

        location = /healthz {
            return 204;
        }

        # Wie CloudFront vor den TLC-Dateien: ETag, Last-Modified und Content-Length für
        # vorhandene Dateien, 403 statt 404 für nicht veröffentlichte Monate.
        location /trip-data/ {
            root       /srv;
            etag       on;
            try_files  $uri =403;
        }

        location / {
            return 403;
        }
    }
}
