worker_processes  1;
pid               /tmp/nginx.pid;

events {
    worker_connections  64;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    server {
        listen  80;

        location = /healthz {
            return 204;
        }

        # Like CloudFront in front of the TLC files: ETag, Last-Modified and Content-Length for
        # existing files, 403 instead of 404 for unpublished months.
        location /trip-data/ {
            root       /srv;
            etag       on;
            try_files  $uri =403;
        }

        location / {
            return 403;
        }
    }
}
