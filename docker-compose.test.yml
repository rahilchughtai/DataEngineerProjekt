# End-to-End-Test: dieselbe Pipeline wie docker-compose.yml, nur mit einer Mock-Quelle statt der TLC
# und einem Test-Container am Ende der Kette:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example \
#     run --build --rm e2e-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example down -v
#
# Eigenes Projekt mit eigenen Volumes und ohne Host-Ports: berührt nie den lokalen Data Lake.
name: taxi-pipeline-test

# Das Quartal, für das tests/e2e/fixtures Dateien enthält; ein kleiner Executor reicht dafür.
x-test-job: &test-job
  environment:
    INGEST_PERIOD: "2024Q1"
    SPARK_EXECUTOR_MEMORY: 512m

services:
  # Liefert gekürzte echte TLC-Dateien (2.000 Fahrten je Monat) und für fehlende Monate wie die TLC 403.
  tlc-mock:
    image: docker.io/library/nginx:1.29.1-alpine
    volumes:
      - ./tests/e2e/tlc-mock/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/e2e/fixtures/trip-data:/srv/trip-data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  seaweedfs:
    ports: !reset []

  spark-master:
    ports: !reset []

  ingestion:
    environment:
      INGEST_PERIOD: "2024Q1"
      TLC_BASE_URL: http://tlc-mock/trip-data
    depends_on:
      tlc-mock:
        condition: service_healthy

  # Ein kleiner Worker genügt für die Testdaten und passt in lokale VMs mit 2 GiB RAM.
  spark-worker:
    deploy:
      replicas: 1
    environment:
      SPARK_WORKER_MEMORY: 1g

  silver-job: *test-job
  gold-job: *test-job
  report: *test-job

  # Prüft den Lake nach dem Lauf; startet nur, wenn alle Schritte erfolgreich waren. Braucht alle
  # Identitäten, weil er deren Zugriffsrechte prüft.
  e2e-tests:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: localhost/taxi-pipeline/e2e-tests:0.1.0
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?siehe .env.example}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?siehe .env.example}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY:?siehe .env.example}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY:?siehe .env.example}
    depends_on:
      report:
        condition: service_completed_successfully
    restart: "no"
