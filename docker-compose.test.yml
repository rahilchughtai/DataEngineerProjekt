# End-to-End-Test: dieselbe Pipeline wie docker-compose.yml, nur mit Mock-Quelle statt CloudFront
# und einem Test-Container am Ende der Kette. Ein Befehl für Laptop und CI (Podman: podman compose):
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example \
#     run --build --rm e2e-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example down -v
#
# Eigenes Projekt mit eigenen Volumes und Netzen und ohne Host-Ports: Ein Testlauf berührt nie den
# lokalen Data Lake und darf neben der normalen Umgebung laufen.
name: taxi-pipeline-test

# Das Quartal, für das tests/e2e/fixtures Dateien enthält.
x-period: &period
  INGEST_PERIOD: "2024Q1"

services:
  # Ersetzt CloudFront: liefert die gekürzten echten TLC-Dateien aus tests/e2e/fixtures mit ETag
  # und Last-Modified und antwortet für nicht veröffentlichte Monate wie CloudFront mit 403.
  tlc-mock:
    image: docker.io/library/nginx:1.29.1-alpine
    volumes:
      - ./tests/e2e/tlc-mock/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/e2e/fixtures/trip-data:/srv/trip-data:ro
    networks: [lakenet]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  seaweedfs:
    ports: !reset []

  spark-master:
    ports: !reset []

  ingestion:
    environment:
      TLC_BASE_URL: http://tlc-mock/trip-data
      <<: *period
      DOWNLOAD_BACKOFF_SECONDS: "0.5"
    depends_on:
      tlc-mock:
        condition: service_healthy

  # Kleiner Cluster: 2.000 Fahrten je Monat brauchen keine zwei Worker, und lokale VMs (Podman
  # Machine) haben oft nur 2 GiB RAM. Die Executor-Grenze muss unter SPARK_WORKER_MEMORY liegen.
  spark-worker:
    deploy:
      replicas: 1
    environment:
      SPARK_WORKER_MEMORY: 1g

  silver-job:
    environment:
      <<: *period
      SPARK_EXECUTOR_MEMORY: 512m

  gold-job:
    environment:
      <<: *period
      SPARK_EXECUTOR_MEMORY: 512m

  # Die Host-Kopie geht in ein Volume statt ins Repo; e2e-tests vergleicht sie mit dem Lake.
  run-report:
    environment: *period
    volumes: !override
      - pipeline-run:/run/pipeline:ro
      - runs-export:/runs

  # Prüft den Lake nach dem Lauf. Startet nur, wenn alle Schritte erfolgreich waren; sein Exit-Code
  # ist das Ergebnis des Tests. Braucht alle Identitäten, weil er deren Zugriffsrechte prüft.
  e2e-tests:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: localhost/taxi-pipeline/e2e-tests:0.1.0
    environment:
      <<: *period
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?siehe .env.example}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?siehe .env.example}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?siehe .env.example}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?siehe .env.example}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?siehe .env.example}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?siehe .env.example}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY:?siehe .env.example}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY:?siehe .env.example}
      BRONZE_BUCKET: bronze
      SILVER_BUCKET: silver
      GOLD_BUCKET: gold
      TLC_BASE_URL: http://tlc-mock/trip-data
      PIPELINE_RUN_ID_FILE: /run/pipeline/run-id
      RUNS_DIR: /runs
    volumes:
      - pipeline-run:/run/pipeline:ro
      - runs-export:/runs:ro
    depends_on:
      run-report:
        condition: service_completed_successfully
    networks: [lakenet]
    restart: "no"

networks:
  lakenet:
    name: taxi-pipeline-test-lakenet
  sparknet:
    name: taxi-pipeline-test-sparknet

volumes:
  seaweedfs-data:
    name: taxi-pipeline-test-seaweedfs-data
  pipeline-run:
    name: taxi-pipeline-test-run
  runs-export:
    name: taxi-pipeline-test-runs
