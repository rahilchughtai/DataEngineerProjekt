# End-to-end test: the same pipeline as docker-compose.yml, but with a mock source instead of the
# TLC and a test container at the end of the chain:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example \
#     run --build --rm e2e-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example down -v
#
# Separate project with its own volumes and no host ports: never touches the local data lake.
name: taxi-pipeline-test

# The quarter tests/e2e/fixtures has files for; a small executor is enough for it.
x-test-job: &test-job
  environment:
    INGEST_PERIOD: "2024Q1"
    SPARK_EXECUTOR_MEMORY: 512m

services:
  # Serves truncated real TLC files (2,000 trips per month) and, like the TLC, 403 for missing months.
  tlc-mock:
    image: docker.io/library/nginx:1.29.1-alpine
    volumes:
      - ./tests/e2e/tlc-mock/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests/e2e/fixtures/trip-data:/srv/trip-data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  seaweedfs:
    ports: !reset []

  spark-master:
    ports: !reset []

  ingestion:
    environment:
      INGEST_PERIOD: "2024Q1"
      TLC_BASE_URL: http://tlc-mock/trip-data
    depends_on:
      tlc-mock:
        condition: service_healthy

  # One small worker is enough for the test data and fits local VMs with 2 GiB RAM.
  spark-worker:
    deploy:
      replicas: 1
    environment:
      SPARK_WORKER_MEMORY: 1g

  silver-job: *test-job
  gold-job: *test-job
  report: *test-job

  # Checks the lake after the run; starts only if all steps succeeded. Needs all identities
  # because it checks their access rights.
  e2e-tests:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: localhost/taxi-pipeline/e2e-tests:0.1.0
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?}
      S3_INGESTION_ACCESS_KEY: ${S3_INGESTION_ACCESS_KEY:?}
      S3_INGESTION_SECRET_KEY: ${S3_INGESTION_SECRET_KEY:?}
      S3_SPARK_ACCESS_KEY: ${S3_SPARK_ACCESS_KEY:?}
      S3_SPARK_SECRET_KEY: ${S3_SPARK_SECRET_KEY:?}
      S3_ML_ACCESS_KEY: ${S3_ML_ACCESS_KEY:?}
      S3_ML_SECRET_KEY: ${S3_ML_SECRET_KEY:?}
    depends_on:
      report:
        condition: service_completed_successfully
    restart: "no"
