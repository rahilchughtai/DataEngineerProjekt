[project]
name = "taxi-batch-pipeline"
version = "0.1.0"
description = "Batch-Datenarchitektur für Taxinachfrage (IU DLMDWWDE02)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3",
    "ruff==0.17.3",
]

[tool.uv]
package = false

# Zentrale Ruff-Konfiguration für alle Services. services/spark erbt sie per extend und setzt
# nur target-version auf py310 (Python des Spark-Images).
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/*/src", "tests/e2e"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "LOG", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "spark_jobs"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
docstring-code-format = true
