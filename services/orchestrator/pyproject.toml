[project]
name = "orchestrator"
version = "0.1.0"
description = "Startet Ingestion, Spark-Job 1 und Spark-Job 2 für ein Quartal nacheinander."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
