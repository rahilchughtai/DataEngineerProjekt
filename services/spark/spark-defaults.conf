# S3A access to SeaweedFS. Each job sets the credentials at runtime (jobs/common.py).
spark.hadoop.fs.s3a.endpoint                  http://seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

spark.sql.session.timeZone                    UTC
# Partition columns year=2024/month=01 stay strings on read instead of being inferred as int.
spark.sql.sources.partitionColumnTypeInference.enabled  false
