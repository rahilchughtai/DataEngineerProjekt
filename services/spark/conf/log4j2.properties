# Spark-Logs auf WARN, damit die Zeilen der Jobs (bronze_to_silver: …) lesbar bleiben.
# Master, Worker und die Executor-Zuteilung bleiben auf INFO: sie belegen die verteilte Ausführung.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.master.name = org.apache.spark.deploy.master
logger.master.level = info
logger.worker.name = org.apache.spark.deploy.worker
logger.worker.level = info
logger.appclient.name = org.apache.spark.deploy.client.StandaloneAppClient$ClientEndpoint
logger.appclient.level = info
# Bekannte, harmlose Warnung im Container ohne native Hadoop-Bibliotheken.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
