[project]
name = "spark-jobs"
version = "0.1.0"
description = "Spark-Jobs der Taxi-Pipeline: Bronze → Silver → Gold und Laufbericht."
# Python-Version des Spark-Images (apache/spark:4.1.3, Ubuntu 22.04). Driver und Executors
# laufen dort, deshalb muss der Code 3.10-kompatibel bleiben.
requires-python = ">=3.10,<3.11"
dependencies = ["pipeline-common"]

[dependency-groups]
# PySpark bringt das Spark-Image mit (unter /opt/spark/python), deshalb nur für die Tests.
dev = [
    "pyspark==4.1.3", # exakt die Version des Images
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.uv.sources]
pipeline-common = { path = "../../libs/pipeline_common" }

[tool.pytest.ini_options]
pythonpath = ["jobs"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Erbt die zentrale Konfiguration, nur das Sprachniveau folgt dem Spark-Image.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"

[tool.ruff.lint]
# `from pyspark.sql import functions as F` ist die übliche PySpark-Konvention.
extend-ignore = ["N812"]
