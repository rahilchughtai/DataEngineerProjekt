[project]
name = "pipeline-common"
version = "0.1.0"
description = "Was Ingestion und Spark gemeinsam verwenden: Zeitraum, Monatspartitionen und Log-Format."
# Runs in both images: ingestion (Python 3.12) and Spark (Python 3.10).
requires-python = ">=3.10,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Inherits the central config; the language level follows the Spark image.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_common"]
