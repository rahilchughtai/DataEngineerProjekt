[project]
name = "pipeline-common"
version = "0.1.0"
description = "Zeitraum und Monatspartitionen, die Ingestion und Spark gemeinsam verwenden."
# Läuft in beiden Images: Ingestion (Python 3.12) und Spark (Python 3.10).
requires-python = ">=3.10,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# Erbt die zentrale Konfiguration, das Sprachniveau folgt dem Spark-Image.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_common"]
